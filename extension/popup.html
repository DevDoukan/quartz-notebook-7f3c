<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>Kalkan DLP</title><link rel="stylesheet" href="popup.css"><script src="popup.js" defer></script></head><body><h1>Kalkan DLP</h1><p>Standart form ve dosya seçimi koruması</p><form id="settings"><label for="key">Paneldeki eşleştirme anahtarı</label><input id="key" type="password" required autocomplete="off"><label for="domains">Korunacak siteler (her satıra bir alan adı)</label><textarea id="domains" rows="5" placeholder="portal.sirket.com&#10;*.example.com"></textarea><label class="check"><input id="enabled" type="checkbox">Korumayı etkinleştir</label><button>Kaydet ve bağlantıyı kontrol et</button></form><p id="status" role="status"></p><small>Seçili sitelerde içerik sadece yerel servise gider. Servis kapalıysa seçili sitelerin form gönderimleri durdurulur. fetch/XHR, özel webmail butonları ve tüm ağ trafiği kapsam dışıdır. Koruma bir kurumsal tarayıcı politikasıyla zorunlu tutulmaz.</small></body></html>
